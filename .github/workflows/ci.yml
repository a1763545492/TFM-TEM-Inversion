name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest + GUI smoke (${{ matrix.os }}, py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps (Linux: tk + xvfb for GUI smoke)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Import check
        run: python -c "import tfm_engine; print('tfm_engine', tfm_engine.__version__)"

      - name: Run test suite
        run: python -m pytest tests/ -q --tb=short

      - name: GUI smoke (Linux, xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -c "import tkinter as tk, tfm_gui; r=tk.Tk(); r.withdraw(); app=tfm_gui.TFMMainApp(r); print('tabs:', app.nb.index('end')); assert app.nb.index('end') >= 12; r.destroy()"

      - name: GUI smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -c "import tkinter as tk, tfm_gui; r=tk.Tk(); r.withdraw(); app=tfm_gui.TFMMainApp(r); print('tabs:', app.nb.index('end')); assert app.nb.index('end') >= 12; r.destroy()"

      - name: CLI help smoke
        run: python tfm_cli_run.py --help
